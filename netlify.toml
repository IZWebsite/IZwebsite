[build]
  base = "frontend"
  command = "yarn build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  GENERATE_SOURCEMAP = "false"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-maintenance"]
  schedule = "*/5 * * * *"

[functions."daily-stock-digest"]
  schedule = "30 3 * * *"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/seo?robots=1"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
